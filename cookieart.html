<footer class="Footer">© Hope Geissert, <span id="currentYear"></span>.</footer>
<script>
document.getElementById("currentYear").textContent = new Date().getFullYear();
</script>

<!-- Modal for Image Display -->
<div id="myModal" class="modal" aria-hidden="true" role="dialog" aria-label="Cookie Modal">
    <button class="close" onclick="closeModal()" aria-label="Close Image Modal">&times;</button>
    <img class="modal-content" id="modalImage" alt="Expanded cookie image">
</div>

<script>
function openModal(src) {
    document.getElementById("modalImage").src = src;
    document.getElementById("myModal").style.display = "block";
    document.getElementById("myModal").setAttribute('aria-hidden','false');
}
function closeModal() {
    document.getElementById("myModal").style.display = "none";
    document.getElementById("myModal").setAttribute('aria-hidden','true');
}
</script>
