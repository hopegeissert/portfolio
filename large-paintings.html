<!-- Top Navigation -->

<!-- Mobile Navigation -->
<div class="MobileNavWrapper">

        <button class="closebtn" onclick="closeNav()" aria-label="Close Navigation">&times;</button>
        <div class="overlay-content">
            <a href="index.html">Work</a>

<script>
function openNav() {
    document.getElementById("myNav").style.width = "100%";
    document.getElementById("myNav").setAttribute('aria-hidden', 'false');
}
function closeNav() {
    document.getElementById("myNav").style.width = "0%";
    document.getElementById("myNav").setAttribute('aria-hidden', 'true');
}
</script>

<main class="ContentWrapper">
    <h1 class="ProjectTitle">Large Paintings</h1>
    <p class="ProjectDescription">
        In my spare time, I enjoy creating large format paintings (acrylic) inspired by places I have traveled with my family. Old trucks and animals are favorite subjects, and I also create typography signs.
    </p>

    <!-- Desktop Gallery -->
    <section class="row" aria-label="Large Paintings Gallery">
        <div class="column">
            <div class="gallery-item">
                <img src="Large Format Paintings/Unity-Painting.jpg" onclick="openModal('Large Format Paintings/Unity-Painting.jpg')" alt="Field of flowers painting">
            </div>
            <div class="gallery-item">
                <img src="Large Format Paintings/horse-colorado.jpg" onclick="openModal('Large Format Paintings/horse-colorado.jpg')" alt="Horse painting in Colorado">
            </div>
            <div class="gallery-item">

            </div>
            <div class="gallery-item">
                <img src="Large Format Paintings/wall-art.jpg" onclick="openModal('Large Format Paintings/wall-art.jpg')" alt="Bedroom wall art painting">
            </div>
            <div class="gallery-item">
                <img src="Large Format Paintings/wordart.jpg" onclick="openModal('Large Format Paintings/wordart.jpg')" alt="Word art painting">
            </div>
        </div>

        <div class="column">
            <div class="gallery-item">
                <img src="Large Format Paintings/oldtruck.jpg" onclick="openModal('Large Format Paintings/oldtruck.jpg')" alt="Old truck painting">
            </div>

                <img src="Large Format Paintings/word-sign.jpg" onclick="openModal('Large Format Paintings/word-sign.jpg')" alt="Word sign art">

            <div class="gallery-item">
                <img src="Large Format Paintings/word-art.jpg" onclick="openModal('Large Format Paintings/word-art.jpg')" alt="Word art painting">
            </div>
        </div>
    </section>

    <!-- Mobile Gallery -->
    <section class="rowsmallscreen" aria-label="Mobile Large Paintings Gallery">
        <div class="column">
            <div class="gallery-item"><img src="Large Format Paintings/Unity-Painting.jpg" onclick="openModal('Large Format Paintings/Unity-Painting.jpg')" alt="Field of flowers painting"></div>
            <div class="gallery-item"><img src="Large Format Paintings/horse-colorado.jpg" onclick="openModal('Large Format Paintings/horse-colorado.jpg')" alt="Horse painting in Colorado"></div>
            <div class="gallery-item"><img src="Large Format Paintings/black-hills.jpg" onclick="openModal('Large Format Paintings/black-hills.jpg')" alt="Black Hills painting"></div>
            <div class="gallery-item"><img src="Large Format Paintings/wall-art.jpg" onclick="openModal('Large Format Paintings/wall-art.jpg')" alt="Bedroom wall art painting"></div>
            <div class="gallery-item"><img src="Large Format Paintings/wordart.jpg" onclick="openModal('Large Format Paintings/wordart.jpg')" alt="Word art painting"></div>
            <div class="gallery-item"><img src="Large Format Paintings/oldtruck.jpg" onclick="openModal('Large Format Paintings/oldtruck.jpg')" alt="Old truck painting"></div>

        </div>
    </section>
</main>

<footer class="Footer">© Hope Geissert, <span id="currentYear"></span>.</footer>
<script>
document.getElementById("currentYear").textContent = new Date().getFullYear();
</script>

<!-- Modal for Image Display -->
<div id="myModal" class="modal" aria-hidden="true" role="dialog" aria-label="Painting Modal">
    <button class="close" onclick="closeModal()" aria-label="Close Image Modal">&times;</button>
    <img class="modal-content" id="modalImage" alt="Expanded painting view">
</div>

<script>
function openModal(src) {
    document.getElementById("modalImage").src = src;
    document.getElementById("myModal").style.display = "block";
    document.getElementById("myModal").setAttribute('aria-hidden','false');
}
function closeModal() {
    document.getElementById("myModal").style.display = "none";
    document.getElementById("myModal").setAttribute('aria-hidden','true');
}
</script>

</body>
</html>
